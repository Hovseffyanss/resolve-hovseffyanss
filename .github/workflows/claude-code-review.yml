name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Manual runs, so the same PR can be reviewed twice with different prompts
  # without pushing a commit. Used to calibrate the gate (noisy vs tuned).
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review (e.g. 11)'
        required: true
        type: string
      mode:
        description: 'Which prompt to run'
        required: true
        default: tuned
        type: choice
        options:
          - tuned
          - noisy

jobs:
  claude-review:
    if: github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------
      # NOISY: the deliberately uncalibrated gate. Manual runs only.
      # ---------------------------------------------------------------
      - name: Run Claude Code Review (noisy)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'noisy'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          prompt: |
            Review pull request #${{ env.PR_NUMBER }} in ${{ github.repository }}.
            Read the diff with: gh pr diff ${{ env.PR_NUMBER }}

            Report every issue you find, including style and naming.

            Output a single numbered list. One finding per number. For each:
            severity, file:line, and one sentence describing the issue.
            End with a line: TOTAL FINDINGS: <n>

            Post the result as a PR comment titled "### Review gate — NOISY run":
            gh pr comment ${{ env.PR_NUMBER }} --body "..."

      # ---------------------------------------------------------------
      # TUNED: the real gate. Runs on every PR, and on manual runs.
      # ---------------------------------------------------------------
      - name: Run Claude Code Review (tuned)
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'tuned'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          prompt: |
            Review pull request #${{ env.PR_NUMBER }} in ${{ github.repository }}.
            Read the diff with: gh pr diff ${{ env.PR_NUMBER }}
            Read CLAUDE.md and src/tickets/CLAUDE.md for this repo's conventions.

            THE BAR: report a finding only if you would block a merge for it at
            6pm on a Friday. If the honest answer is "this can be a follow-up",
            it is not a finding. A gate that cries wolf gets turned off.

            Report only these, in this order:

            1. CORRECTNESS — the changed code is wrong: wrong result, crash,
               unhandled null, broken edge case, data loss.
            2. LAYERING — a service injects DataSource or a raw TypeORM
               repository (tests rebuild the module graph over SQLite and cannot
               construct it), or a controller validates instead of the service.
            3. AUDIT — a ticket mutation that does not call AuditService.record
               exactly once, or an action name that is not entity.verb.
            4. DIALECT — passes on SQLite, fails on Postgres: raw SQL with
               unquoted mixed-case identifiers, or a non-nullable column being
               written null.
            5. CONVENTIONS THAT BREAK CALLERS — a validation failure that is not
               a BadRequestException naming the offending field; an id not from
               newId(prefix); a paginated endpoint not using
               parseOffsetPagination and returning { items, total, limit, offset }.
            6. TESTS THAT CANNOT FAIL — a test that still passes when the
               behaviour under test changes, or a new rejection path with no test.

            NOT FINDINGS. Do not report these, at any severity:
            - style, formatting, naming, comment density, import order
            - subjective structure preferences, "consider extracting"
            - anything already listed as accepted debt or negative space in
              CLAUDE.md (listAudit reversing in memory, @Optional() tagRepo,
              synchronize: true, seq in responses, unpaginated GET /audit)
            - pre-existing issues the diff did not touch

            Output a single numbered list. One finding per number. For each:
            severity (HIGH or MEDIUM), file:line, one sentence on the defect, and
            one sentence on what breaks if it ships.
            End with a line: TOTAL FINDINGS: <n>

            Post the result as a PR comment titled "### Review gate — TUNED run":
            gh pr comment ${{ env.PR_NUMBER }} --body "..."
