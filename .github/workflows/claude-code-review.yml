name: Claude Code Review

# Two prompts, one gate.
#
#   tuned — the real gate. Runs on every PR, and on manual runs by default.
#   noisy — "report every issue you find, including style and naming."
#           Manual runs only. It exists to be counted against `tuned`.
#
# Both prompts end with `TOTAL FINDINGS: <n>` and post their review as a PR
# comment, so the two runs can be counted side by side instead of read line
# by line.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review (e.g. 11)'
        required: true
        default: '11'
        type: string
      mode:
        description: 'Which prompt to run'
        required: true
        default: tuned
        type: choice
        options:
          - tuned
          - noisy

jobs:
  claude-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the gate posts its verdict back onto the PR.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve target PR and mode
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "mode=tuned" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tuned gate
        if: steps.target.outputs.mode == 'tuned'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          prompt: |
            You are the review gate for this repository, reviewing pull request
            #${{ steps.target.outputs.pr }}.

            Get the diff with: gh pr diff ${{ steps.target.outputs.pr }}

            `CLAUDE.md` and `src/tickets/CLAUDE.md` are in the checked-out tree.
            They are the conventions you enforce — read them first.

            The checked-out tree is `main`, not this PR's head, and on a manual
            run it can be many commits newer than the diff you are reviewing.
            So a file that differs between the diff and its copy on disk is not
            evidence of anything: it usually means `main` moved on afterwards.
            Judge every file in the diff on its own contents. Never report a
            regression, a downgrade, or an overwrite on the strength of a
            comparison against the working tree.

            THE BAR. For every finding, ask: would this block a merge at 6pm on
            a Friday? If the answer is no, drop it. A gate that reports
            everything is a gate people learn to click past, and then it is not
            there on the day it was right.

            REPORT:

            1. Correctness — the change does not do what it claims, or it breaks
               an existing path.
            2. Layering — a service injecting `DataSource` or a raw TypeORM
               repository. Only a repository touches `Repository<Entity>`. A
               service that reaches past its repository cannot be tested against
               the in-memory SQLite module graph at all.
            3. Audit — every ticket mutation calls `AuditService.record` exactly
               once, with an action named `entity.verb`. A mutation with no
               entry, or with two, is a finding. Any edit to `src/audit/` is a
               finding on its own; that directory is frozen.
            4. Dialect — tests run on in-memory SQLite, production runs
               PostgreSQL. Raw SQL with unquoted mixed-case identifiers (e.g.
               `tt."ticketId"` losing its quotes), or a non-nullable column
               written null, passes the whole suite and fails at runtime in
               production. This class of bug is invisible to the tests, so it is
               yours to catch.
            5. Validation contract — validation failures throw
               `BadRequestException` naming the offending field, so a caller
               knows which field to fix. Validation living in a controller is a
               finding; it drifts from the service copy, and only the service is
               covered by tests.
            6. Caller-visible conventions — ids come from `newId(prefix)`;
               paginated endpoints use `parseOffsetPagination` and return
               `{ items, total, limit, offset }`; the actor comes from the
               `X-Actor` header and is threaded to `audit.record`, and is never
               used to authorize or gate behaviour.
            7. Internal comments — `internal: true` marks agent-only notes that
               must never reach customers. A change that drops or inverts that
               distinction in serialization is a finding.
            8. Tests that cannot fail — a test that still passes when the
               constant it asserts changes is not coverage. Also: rows created
               in a loop without frozen timers collide on millisecond
               `createdAt`, so any ordering assertion over them is luck.

            DO NOT REPORT:

            - Style, formatting, naming, comment wording, import order. These
              are not findings in this repo, under any severity.
            - Accepted debt already documented in `CLAUDE.md`:
              `TicketsRepository.tagRepo` being `@Optional()` (D-1), `seq`
              appearing in responses (D-2), `synchronize: true`, `GET /audit`
              being unpaginated, and `listAudit` reversing in memory. These are
              known and written down. Repeating them is noise.
            - Restructuring suggestions for code that works.
            - Missing tests for code this PR did not touch.
            - Races that need two concurrent requests against the same resource
              and whose worst outcome is cosmetic — a duplicate row, a repeated
              string in a response — with no data lost, no audit entry written
              for a mutation that did not happen, and nothing the caller sees as
              an error. Demoted deliberately: correct, and not worth holding a
              Friday evening deploy for. A race that loses data or corrupts the
              audit trail is still a finding, and still HIGH.

            OUTPUT. For each finding: severity (HIGH or MEDIUM), `file:line`,
            what breaks, and why it blocks the merge. Then a verdict line.

            End your output with a line in exactly this form:

            TOTAL FINDINGS: <n>

            Finally, post the full review as a PR comment, titled
            `## Review gate — tuned`:
            gh pr comment ${{ steps.target.outputs.pr }} --body-file <your file>

      - name: Run noisy gate
        if: steps.target.outputs.mode == 'noisy'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          prompt: |
            You are reviewing pull request #${{ steps.target.outputs.pr }} in
            this repository.

            Get the diff with: gh pr diff ${{ steps.target.outputs.pr }}

            Report every issue you find, including style and naming.

            For each finding: severity, `file:line`, and what is wrong.

            End your output with a line in exactly this form:

            TOTAL FINDINGS: <n>

            Finally, post the full review as a PR comment, titled
            `## Review gate — noisy`:
            gh pr comment ${{ steps.target.outputs.pr }} --body-file <your file>
